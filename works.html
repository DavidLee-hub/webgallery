  <!-- ============ LIGHTBOX (확대 + 자동 슬라이드) ============ -->

  <script>
  (function () {
    const images = [
      'img/works-1.jpg', 'img/works-2.jpg', 'img/works-3.jpg',
      'img/works-4.jpg', 'img/works-5.jpg', 'img/works-6.jpg',
      'img/works-7.jpg', 'img/works-8.jpg', 'img/works-9.jpg',
      'img/works-10.jpg','img/works-11.jpg','img/works-12.jpg',
      'img/works-13.jpg'
    ];

    const thumbs = document.querySelectorAll('.works__thumb');
    const previewImg = document.querySelector('.works__preview-img');
    const previewPlaceholder = document.querySelector('.works__preview-placeholder');

    const lightbox = document.getElementById('lightbox');
    const lbImg = lightbox.querySelector('.lightbox__img');
    const lbCurrent = document.getElementById('lightbox-current');
    const lbProgress = document.getElementById('lightbox-progress');
    const SLIDE_INTERVAL = 4000;
    let current = 0;
    let autoTimer = null;

    // 썸네일 클릭 → 오른쪽 미리보기
    thumbs.forEach(function (thumb) {
      thumb.addEventListener('click', function () {
        const idx = parseInt(this.dataset.index);
        showPreview(idx);
      });

      // 미리보기 이미지 더블클릭 → 라이트박스
      thumb.addEventListener('dblclick', function () {
        const idx = parseInt(this.dataset.index);
        openLightbox(idx);
      });
    });

    // 미리보기 클릭 → 라이트박스
    previewImg.addEventListener('click', function () {
      openLightbox(current);
    });

    function showPreview(idx) {
      current = idx;
      thumbs.forEach(function (t) { t.classList.remove('is-active'); });
      thumbs[idx].classList.add('is-active');
      previewImg.src = images[idx];
      previewImg.alt = thumbs[idx].querySelector('img').alt;
      previewImg.style.display = 'block';
      previewPlaceholder.style.display = 'none';
    }

    // 라이트박스
    function openLightbox(idx) {
      current = idx;
      updateLightbox();
      lightbox.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      startAuto();
    }

    function closeLightbox() {
      lightbox.classList.remove('is-open');
      document.body.style.overflow = '';
      stopAuto();
    }

    function updateLightbox() {
      lbImg.src = images[current];
      lbCurrent.textContent = current + 1;
    }

    function next() { current = (current + 1) % images.length; updateLightbox(); resetAuto(); }
    function prev() { current = (current - 1 + images.length) % images.length; updateLightbox(); resetAuto(); }

    function startAuto() {
      stopAuto();
      lbProgress.style.transition = 'none';
      lbProgress.style.width = '0%';
      requestAnimationFrame(function () {
        lbProgress.style.transition = 'width ' + SLIDE_INTERVAL + 'ms linear';
        lbProgress.style.width = '100%';
      });
      autoTimer = setInterval(function () {
        current = (current + 1) % images.length;
        updateLightbox();
        lbProgress.style.transition = 'none';
        lbProgress.style.width = '0%';
        requestAnimationFrame(function () {
          lbProgress.style.transition = 'width ' + SLIDE_INTERVAL + 'ms linear';
          lbProgress.style.width = '100%';
        });
      }, SLIDE_INTERVAL);
    }

    function stopAuto() { clearInterval(autoTimer); }
    function resetAuto() { startAuto(); }

    lightbox.querySelector('.lightbox__close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox__prev').addEventListener('click', prev);
    lightbox.querySelector('.lightbox__next').addEventListener('click', next);

    lightbox.addEventListener('click', function (e) {
      if (e.target === lightbox || e.target.classList.contains('lightbox__img-wrap')) closeLightbox();
    });

    document.addEventListener('keydown', function (e) {
      if (!lightbox.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });
  })();
  </script>

  <script src="js/no-download.js"></script>
</body>
