<body>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="logo"><img src="img/leehyenjun_rainbow_logo_no_subtitle.gif" alt="LEE HYEN JUN"></a>
      <nav class="gnb">
        <ul>
          <li><a href="projects.html" class="active">WORKS</a></li>
          <li><a href="https://gallery.junphoto.co.kr/gallery.html">GALLERY</a></li>
        </ul>
      </nav>
      <div class="header__icon-links">
        <a href="https://gallery.junphoto.co.kr/board.html" class="header__board" aria-label="게시판" title="게시판">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </a>
        <button id="signupBtn" class="header__user-link" aria-label="회원가입" title="회원가입">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ PROJECTS GALLERY ============ -->
  <section class="projects">
    <div class="projects__inner">

      <div class="projects__grid">

        <!-- 프로젝트 1: B&W (Black & White) -->
        <a href="works.html" class="project-card">
          <div class="project-card__thumb">
            <img src="img/works-1.jpg" alt="Black & White Photography">
            <div class="project-card__overlay"></div>
          </div>
          <div class="project-card__info">
            <h2 class="project-card__name">B&amp;W</h2>
            <p class="project-card__desc">Black &amp; White Photography — 자연과 풍경을 흑백으로 담아낸 프로젝트</p>
            <span class="project-card__meta">13 Photos</span>
          </div>
        </a>

      </div>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="footer__inner">
      <span class="footer__copy">&copy; 2026 LEE HYEN JUN. All rights reserved.</span>
      <div class="footer__links">
        <a href="https://mail.google.com/mail/?view=cm&to=cslee835@gmail.com" target="_blank" aria-label="이메일 보내기"><i class="fa fa-envelope"></i></a>
        <a href="https://www.instagram.com/davidlee_2026" target="_blank" aria-label="인스타그램"><i class="fa fa-instagram"></i></a>
      </div>
    </div>
  </footer>

  <script src="js/no-download.js"></script>

  <!-- ============ 회원가입 모달 ============ -->
  <div class="signup-modal-overlay" id="signupModalOverlay">
    <div class="signup-modal">
      <button class="signup-modal__close" id="signupModalClose" aria-label="닫기">&times;</button>
      <h2 class="signup-modal__title">회원가입</h2>
      <div class="signup-modal__form">
        <input type="text" id="signupNickname" placeholder="닉네임" maxlength="20">
        <input type="email" id="signupEmail" placeholder="이메일">
        <input type="password" id="signupPassword" placeholder="비밀번호 (6자 이상)">
        <p class="signup-modal__message" id="signupMessage"></p>
        <button class="signup-modal__submit" id="signupSubmit">회원가입</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/signup.js"></script>
